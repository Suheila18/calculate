<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-blue-300 rounded-2xl shadow-2xl p-6 w-80">
        <!-- Display -->
        <div class="bg-gray-900 rounded-lg p-4 mb-4">
            <div id="display" class="text-white text-right text-3xl font-mono h-10">0</div>
        </div>
        
        <!-- Buttons Grid -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Row 1 -->
            <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg transition" onclick="clearAll()">AC</button>
            <button class="bg-red-400 hover:bg-red-500 text-white font-bold py-3 rounded-lg transition" onclick="deleteLast()">DE</button>
            <button class="bg-gray-300 hover:bg-gray-400 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('%')">%</button>
            <button class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition" onclick="appendToDisplay('+')">+</button>
            
            <!-- Row 2 -->
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('7')">7</button>
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('8')">8</button>
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('9')">9</button>
            <button class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition" onclick="appendToDisplay('-')">-</button>
            
            <!-- Row 3 -->
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('4')">4</button>
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('5')">5</button>
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('6')">6</button>
            <button class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition" onclick="appendToDisplay('*')">×</button>
            
            <!-- Row 4 -->
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('1')">1</button>
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('2')">2</button>
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('3')">3</button>
            <button class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition" onclick="appendToDisplay('/')">÷</button>
            
            <!-- Row 5 -->
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition col-span-2" onclick="appendToDisplay('0')">0</button>
            <button class="bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg transition" onclick="appendToDisplay('.')">.</button>
            <button class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '0';
        let shouldResetDisplay = false;

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function appendToDisplay(value) {
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = value;
                shouldResetDisplay = false;
            } else {
                currentInput += value;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            updateDisplay();
        }

        function deleteLast() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function calculate() {
            try {
          let expression = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                
           
                expression = expression.replace(/(\d+)%/g, '($1/100)');
                
                let result = eval(expression);
                
             
                if (Number.isInteger(result)) {
                    currentInput = result.toString();
                } else {
                    currentInput = parseFloat(result.toFixed(10)).toString();
                }
                
                shouldResetDisplay = true;
                updateDisplay();
            } catch (error) {
                currentInput = 'Error';
                updateDisplay();
                setTimeout(() => {
                    currentInput = '0';
                    updateDisplay();
                }, 1500);
            }
        }

        
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendToDisplay(key);
            } else if (key === '.') {
                appendToDisplay('.');
            } else if (key === '+' || key === '-' || key === '*') {
                appendToDisplay(key);
            } else if (key === '/') {
                event.preventDefault();
                appendToDisplay('/');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape' || key === 'Delete') {
                clearAll();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === '%') {
                appendToDisplay('%');
            }
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
